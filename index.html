<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amal - Erste Bank Portal</title>
    <style>
        :root { --erste-blue: #003399; --erste-red: #e30613; --amal-bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #0b0b15; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; }
        
        /* LOGIN & LOADING STYLES */
        .login-box, .loader-box { background: #16213e; padding: 40px; border-radius: 12px; text-align: center; border: 1px solid #0f3460; width: 350px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #0f3460; background: #0f3460; color: white; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 12px; background: var(--erste-red); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        /* REGISTRATION STYLES */
        #register-section { display: none; flex-direction: column; align-items: center; background: var(--amal-bg); min-height: 100vh; width: 100%; padding: 40px 20px; color: #333; }
        .card-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .card { background: white; border-radius: 15px; width: 450px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 8px solid var(--erste-blue); position: relative; }
        .form-title { font-size: 14px; font-weight: bold; color: #888; text-transform: uppercase; margin-bottom: 20px; display: block; border-bottom: 1px solid #eee; }
        label { display: block; font-size: 11px; font-weight: bold; color: #555; margin-top: 10px; text-transform: uppercase; }
        .reg-input { background: #fafafa; border: 1px solid #ddd; color: #333; }
        
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--erste-red); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-section" class="login-box">
        <h2 style="color:var(--erste-blue)">AMAL <span style="color:var(--erste-red)">ERSTE</span></h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="handleLogin()" class="btn-main">LOGIN TO SYSTEM</button>
    </div>

    <!-- 2. LOADING SCREEN -->
    <div id="loader" style="display:none;" class="loader-box">
        <div class="spinner"></div>
        <p id="loader-text">AUTHENTICATING...</p>
    </div>

    <!-- 3. MAIN PORTAL -->
    <div id="register-section">
        <div style="text-align:center; margin-bottom:30px; border-bottom:4px solid var(--erste-red); width:100%; max-width:600px;">
            <h1 style="color:var(--erste-blue); margin:0;">AMAL CLIENT PORTAL</h1>
            <p style="color:#666;">Croatia Region | Session: brankomilos</p>
        </div>

        <div class="card-container">
            <div class="card" id="main-card">
                <div id="dynamic-content">
                    <span class="form-title">Step 1: Personal Information</span>
                    <label>Full Name</label><input type="text" class="reg-input" placeholder="Branko Milos">
                    <label>Address</label><input type="text" class="reg-input" placeholder="Ulica, Grad, Croatia">
                    <label>Birth Date</label><input type="date" class="reg-input">
                    <label>Contact Number</label><input type="text" class="reg-input" value="+385 ">
                    <button onclick="goToStep2()" class="btn-main" style="background:var(--erste-blue); margin-top:20px;">SAVE & NEXT STEP</button>
                </div>
            </div>
            
            <!-- SYSTEM LOGS CARD -->
            <div class="card" style="border-top-color:var(--erste-red); width:350px;">
                <span class="form-title">System Status</span>
                <div id="sys-log" style="font-size:13px; color:#555;">
                    <p>• Region: <b>Croatia (HR)</b></p>
                    <p id="step-status">• Current: <b>Step 1 - Active</b></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            if(document.getElementById('username').value === "brankomilos" && document.getElementById('password').value === "160897") {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('loader').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('register-section').style.display = 'flex';
                    document.body.style.backgroundColor = "#f4f7f9";
                }, 1500);
            }
        }

        function goToStep2() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('loader-text').innerHTML = "SAVING PERSONAL DATA...";
            document.getElementById('register-section').style.opacity = "0.5";
            
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('register-section').style.opacity = "1";
                document.getElementById('step-status').innerHTML = "• Current: <b>Step 2 - Verification</b>";
                document.getElementById('dynamic-content').innerHTML = `
                    <span class="form-title">Step 2: Identity Verification</span>
                    <label>OIB (Personal Identification Number)</label>
                    <input type="text" class="reg-input" placeholder="Enter 11-digit OIB" maxlength="11">
                    <label>Document Type</label>
                    <select class="reg-input">
                        <option>Passport (Putovnica)</option>
                        <option>National ID (Osobna Iskaznica)</option>
                    </select>
                    <label>Document Number</label>
                    <input type="text" class="reg-input" placeholder="Serial Number">
                    <label>Upload ID Photo</label>
                    <input type="file" class="reg-input">
                    <button onclick="finish()" class="btn-main" style="background:#28a745; margin-top:20px;">COMPLETE REGISTRATION</button>
                `;
            }, 1500);
        }

        function finish() { alert("Data transmitted to Erste Bank Croatia. Registration Complete!"); }
    </script>
</body>
</html>
