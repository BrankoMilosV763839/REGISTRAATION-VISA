<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amal - Erste Bank Client Entry</title>
    <style>
        :root { --erste-blue: #003399; --erste-red: #e30613; --amal-bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--amal-bg); margin: 0; padding: 20px; color: #333; display: flex; justify-content: center; }
        
        .container { width: 100%; max-width: 600px; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 10px solid var(--erste-blue); }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        .bank-logo { color: var(--erste-red); font-size: 40px; font-weight: 900; margin-bottom: 10px; }
        
        h2 { color: var(--erste-blue); text-transform: uppercase; font-size: 18px; margin-top: 30px; border-left: 5px solid var(--erste-red); padding-left: 10px; }
        
        label { display: block; font-size: 12px; font-weight: bold; color: #666; margin-top: 15px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; background: #fafafa; font-size: 14px; }
        input:focus { border-color: var(--erste-blue); outline: none; }

        .btn-submit { width: 100%; padding: 15px; background: var(--erste-blue); color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 40px; text-transform: uppercase; transition: 0.3s; }
        .btn-submit:hover { background: #002266; }
        
        .footer-info { text-align: center; margin-top: 20px; font-size: 11px; color: #999; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="bank-logo">Š</div>
        <h1 style="color: var(--erste-blue); margin: 0; font-size: 24px;">CLIENT DATA ENTRY</h1>
        <p style="color: #888; font-size: 13px;">ERSTE BANK CROATIA | Administrator: brankomilos</p>
    </div>

    <form id="entryForm">
        <!-- SECTION 1: PERSONAL -->
        <h2>1. Personal Information</h2>
        <label>Full Name</label>
        <input type="text" placeholder="Enter complete name">
        
        <label>Residential Address (Croatia)</label>
        <input type="text" placeholder="Street, City, Postal Code">
        
        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Birth Date</label>
                <input type="text" placeholder="DD/MM/YYYY">
            </div>
            <div style="flex: 1;">
                <label>Contact (+385)</label>
                <input type="text" value="+385 ">
            </div>
        </div>

        <!-- SECTION 2: IDENTITY -->
        <h2>2. Identity Verification</h2>
        <label>OIB (Personal Identification Number)</label>
        <input type="text" placeholder="11-digit OIB">
        
        <label>Document Type</label>
        <select>
            <option>National ID (Osobna Iskaznica)</option>
            <option>Passport (Putovnica)</option>
            <option>Driver's License</option>
        </select>
        
        <label>Document Serial Number</label>
        <input type="text" placeholder="Serial Number on ID">

        <!-- SECTION 3: CARD DETAILS -->
        <h2>3. Visa Card Details</h2>
        <label>Card Type</label>
        <select>
            <option>Visa Gold Card</option>
            <option>Visa Platinum Card</option>
        </select>

        <label>16-Digit Card Number</label>
        <input type="text" placeholder="0000 0000 0000 0000">

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Expiry Date</label>
                <input type="text" placeholder="MM/YY">
            </div>
            <div style="flex: 1;">
                <label>CVV / CVC</label>
                <input type="password" placeholder="***">
            </div>
        </div>

        <button type="button" class="btn-submit" onclick="submitData()">Submit All Details</button>
    </form>

    <div class="footer-info">
        Authorized by Amal Security Systems | Region: HR-Croatia
    </div>
</div>

<script>
    function submitData() {
        // Auto-verify: kahit ano ilagay, success agad
        alert("Client details have been successfully recorded in the Erste Bank Croatia database.");
        location.reload();
    }
</script>

</body>
</html>
